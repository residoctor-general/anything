<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 外部への通信を一切させない設定（connect-src 'none'） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>個人情報を伏せる</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>個人情報を伏せる</h1>
  <p class="lead">このページは、入力した文章をどこにも送信・保存しません。処理はすべてこのブラウザの中だけで行います。</p>

  <div class="grid">
    <section class="panel">
      <h2>1. カルテの文章を貼る</h2>
      <div class="row">
        <label for="ref">基準日（日付をこの日からの「○日前」に変換）</label>
        <input type="date" id="ref">
      </div>
      <textarea id="input" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"
        placeholder="ここにカルテの文章を貼り付けてください"></textarea>
      <div class="row">
        <button class="primary" id="btn-run">伏せる</button>
        <button class="danger" id="btn-clear">削除（すべて消す）</button>
      </div>
    </section>

    <section class="panel">
      <h2>2. 確認する</h2>
      <div class="legend">
        <span><span class="m">自動で伏せた</span></span>
        <span><span class="m manual">手で伏せた</span></span>
        <span><span class="q">怪しい（まだ伏せていない）</span></span>
      </div>
      <div class="view" id="view" tabindex="0"></div>
      <div class="row">
        <label for="label">選んだ範囲を</label>
        <select id="label">
          <option>伏せ字</option><option>氏名</option><option>施設名</option><option>医師名</option>
          <option>地名</option><option>番号</option><option>日付</option>
        </select>
        <button id="btn-mask" disabled>として伏せる</button>
        <button id="btn-unmask" disabled>元に戻す</button>
      </div>
      <div class="row">
        <button id="btn-suspects" disabled>怪しい箇所をすべて伏せる</button>
      </div>
      <div class="status" id="status"></div>
      <ul class="notes">
        <li>文字をなぞって選んでからボタンを押します。</li>
        <li>伏せ漏れはゼロにはできません。最後は必ず目で確認してください。</li>
      </ul>
    </section>
  </div>

  <section class="panel">
    <h2>3. 持ち出す</h2>
    <div class="row">
      <button class="primary" id="btn-qr" disabled>QRコードを表示</button>
      <button id="btn-copy" disabled>コピー</button>
    </div>
    <div class="qr hidden" id="qr-area">
      <div id="qr-box"></div>
      <div class="row">
        <button id="qr-prev">前へ</button>
        <span id="qr-count"></span>
        <button id="qr-next">次へ</button>
      </div>
      <p class="small" id="qr-note"></p>
    </div>
  </section>
</main>
<script src="vendor/qrcode.js"></script>
<script src="rules.js"></script>
<script src="codec.js"></script>
<script src="app.js"></script>
</body>
</html>
